<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registro de Observação · Colégio Moraes Rêgo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--base:#f5f8fc;--acolh:#e6f0fa;--pet:#0059a9;--prof:#023867;--verde:#7fd3f0;--vesc:#006db8;--vten:#dcecf9;--tinta:#14243a;--suave:#4c5d72;--dour:#2f6fa8;--linha:#d3e0ee;--forte:#7f93aa;--A:#176b58;--EP:#b07a1f;--AP:#b4475f;--NO:#7a7f7d}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Source Sans 3',Arial,sans-serif;background:var(--base);color:var(--tinta);font-size:16px;line-height:1.45;min-height:100vh}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
header{background:linear-gradient(90deg,var(--prof),var(--pet));color:var(--base);padding:14px 20px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:10}
header h1{font-family:'Newsreader',Georgia,serif;font-weight:300;font-size:22px;flex:1;line-height:1.15}
header h1 small{display:block;font-family:'Source Sans 3';font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--verde);font-weight:600}
.back{font-size:22px;padding:4px 10px;border-radius:8px}
.back:hover{background:rgba(255,255,255,.1)}
main{max-width:980px;margin:0 auto;padding:20px 16px 100px}
.card{background:#fff;border:1px solid var(--linha);border-radius:12px;padding:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{background:var(--pet);color:var(--base);padding:10px 16px;border-radius:10px;font-weight:600}
.btn:hover{background:var(--prof)}
.btn.sec{background:var(--acolh);color:var(--pet)}
.btn.sec:hover{background:#e6d9c6}
.btn.ghost{background:transparent;color:var(--vesc);border:1px solid var(--linha)}
.btn.danger{background:transparent;color:var(--AP);border:1px solid #e8c4cd}
.field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:180px}
.field label{font-size:13px;font-weight:600;color:var(--suave)}
.field input,.field select,textarea{border:1px solid var(--linha);border-radius:8px;padding:10px 12px;background:#fff}
.field input:focus,.field select:focus,textarea:focus{outline:2px solid var(--verde);border-color:var(--verde)}
h2{font-family:'Newsreader',Georgia,serif;font-weight:300;font-size:30px;color:var(--pet);line-height:1.15}
h3{font-size:15px;font-weight:700;color:var(--pet)}
.eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--vesc);font-weight:700}
.muted{color:var(--suave);font-size:14px}
.stack{display:flex;flex-direction:column;gap:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.child{display:flex;flex-direction:column;gap:10px;text-align:left;transition:transform .1s}
.child:hover{border-color:var(--verde);transform:translateY(-1px)}
.child .nome{font-family:'Newsreader',Georgia,serif;font-size:22px;color:var(--pet)}
.bar{height:8px;background:var(--acolh);border-radius:6px;overflow:hidden;display:flex}
.bar span{display:block;height:100%}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:12px;font-weight:700;padding:2px 8px;border-radius:20px;color:#fff}
.pA{background:var(--A)}.pEP{background:var(--EP)}.pAP{background:var(--AP)}.pNO{background:var(--NO)}
.filter{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:20px;border:1px solid var(--linha);background:#fff;font-size:14px;font-weight:600;color:var(--suave)}
.chip.on{background:var(--pet);color:var(--base);border-color:var(--pet)}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--linha);margin:0 -16px;padding:0 16px;scrollbar-width:none}
.tabs button{padding:10px 14px;font-weight:600;color:var(--suave);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--pet);border-color:var(--verde)}
.campo{display:flex;flex-direction:column;gap:0}
.campo-h{display:flex;justify-content:space-between;align-items:center;padding:14px 0 8px;gap:10px}
.item{background:#fff;border:1px solid var(--linha);border-radius:10px;padding:12px 14px;margin-bottom:8px;display:flex;flex-direction:column;gap:8px}
.item-top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.item-txt{flex:1;min-width:200px}
.item-txt .cod{font-size:12px;color:var(--dour);font-weight:600;margin-top:2px}
.seg{display:flex;border:1px solid var(--linha);border-radius:8px;overflow:hidden;flex-shrink:0}
.seg button{padding:8px 0;width:46px;font-size:13px;font-weight:700;color:var(--suave);border-left:1px solid var(--linha)}
.seg button:first-child{border-left:none}
.seg button.on[data-v=A]{background:var(--A);color:#fff}
.seg button.on[data-v=EP]{background:var(--EP);color:#fff}
.seg button.on[data-v=AP]{background:var(--AP);color:#fff}
.seg button.on[data-v=NO]{background:var(--NO);color:#fff}
.note{display:flex;gap:8px;align-items:flex-start}
.note textarea{flex:1;min-height:40px;resize:vertical;font-size:14px}
.addnote{font-size:13px;color:var(--vesc);font-weight:600;align-self:flex-start}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.legend div{border-left:4px solid;padding:8px 12px;background:#fff;border-radius:0 8px 8px 0;font-size:14px}
.bloco{border-left:5px solid;padding:16px 18px;background:#fff;border-radius:0 12px 12px 0;display:flex;flex-direction:column;gap:10px}
.bloco textarea{min-height:170px;width:100%;line-height:1.55;font-size:15px}
.fab{position:fixed;right:20px;bottom:20px;box-shadow:0 6px 20px rgba(2,56,103,.25);border-radius:30px;padding:14px 22px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--prof);color:#fff;padding:10px 18px;border-radius:24px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
.modal{position:fixed;inset:0;background:rgba(2,56,103,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:40}
.modal .card{max-width:480px;width:100%;display:flex;flex-direction:column;gap:14px}
table.g{border-collapse:collapse;width:100%;font-size:14px}
table.g th{background:var(--pet);color:#fff;text-align:left;padding:8px 10px}
table.g td{padding:8px 10px;border-bottom:1px solid var(--linha);vertical-align:top}
table.g tr:nth-child(even) td{background:var(--acolh)}
.empty{text-align:center;padding:40px 20px;color:var(--suave)}
footer{font-size:12px;color:var(--suave);text-align:center;padding:24px 16px;display:flex;flex-direction:column;align-items:center;gap:8px}
.logo-mr{background:#fff;border-radius:10px;padding:4px 6px;display:flex;align-items:center;flex-shrink:0}
.logo-mr img{height:38px;display:block}
.assess{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.assess img{height:30px}
.printonly{display:none}
@media(max-width:520px){header{padding:10px 12px;gap:10px}header h1{font-size:17px}header h1 small{font-size:10px;letter-spacing:1px}.logo-mr img{height:30px}#sync{font-size:10px;max-width:80px}#guiaBtn,#lockBtn{padding:6px 10px!important}}
@media print{.printonly{display:flex!important}}
@media print{header,.noprint,.fab,.tabs{display:none!important}body{background:#fff}main{padding:0}.bloco{border:none;padding:0 0 14px}.bloco textarea{border:none;min-height:0;height:auto;overflow:visible}}
</style>
</head>

const NUVEM={on:false,ref:null,db:null,user:null,uid:null,timer:null,gravando:false,pendente:false,coord:false};
function status(t,cor){const e=document.getElementById("sync");if(e){e.textContent=t;e.style.color=cor||"var(--verde)"}}
function agendarNuvem(){if(!NUVEM.ref)return;clearTimeout(NUVEM.timer);status("Salvando…","#e6f0fa");NUVEM.timer=setTimeout(gravarNuvem,1200)}
async function gravarNuvem(){if(!NUVEM.ref)return;if(NUVEM.gravando){NUVEM.pendente=true;return}
 NUVEM.gravando=true;
 try{await NUVEM.ref.set({criancas:JSON.parse(JSON.stringify(DB.criancas)),atualizado:new Date().toISOString()});NUVEM.on=true;status("☁ Salvo na nuvem");
  const f=document.getElementById("footnote");if(f)f.textContent="Os registros ficam salvos na sua conta e aparecem em qualquer aparelho em que você abrir este link.";}
 catch(e){if(e&&e.code==="unavailable"){setTimeout(gravarNuvem,1500+Math.random()*1000)}
  else{NUVEM.ref=null;NUVEM.on=false;status("Salvo só neste aparelho","#eeae69");if(e&&e.code==="quota_exceeded")toast("Espaço na nuvem esgotado. Exporte um backup.")}}
 finally{NUVEM.gravando=false;if(NUVEM.pendente){NUVEM.pendente=false;gravarNuvem()}}}
function comTempo(pr,ms){return Promise.race([pr,new Promise((_,r)=>setTimeout(()=>r({code:"timeout"}),ms))])}
async function iniciarNuvem(){
 try{if(!window.claude||!window.claude.use){status("Salvo neste aparelho","#eeae69");return}
  const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
  if(!db||!user){status("Salvo neste aparelho","#eeae69");return}
  const uid=await user.id();if(!uid){status("Salvo neste aparelho","#eeae69");return}
  Object.assign(NUVEM,{db,user,uid});
  NUVEM.coord=await user.isOwner();
  const ref=db.doc("professoras/"+uid);
  status("Conectando…","#e6f0fa");
  const snap=await comTempo(ref.get(),10000);
  NUVEM.ref=ref;
  const remoto=snap.exists&&Array.isArray((snap.data()||{}).criancas)?snap.data().criancas:null;
  if(remoto){const ids=new Set(remoto.map(c=>c.id));const soLocal=DB.criancas.filter(c=>!ids.has(c.id));
   DB.criancas=remoto.map(c=>JSON.parse(JSON.stringify(c))).concat(soLocal);saveLocal();
   if(soLocal.length)await gravarNuvem();else{NUVEM.on=true;status("☁ Salvo na nuvem")}}
  else await gravarNuvem();
  if(NUVEM.on){const f=document.getElementById("footnote");if(f)f.textContent="Os registros ficam salvos na sua conta e aparecem em qualquer aparelho em que você abrir este link."}
  if(view.tela==="home")render();else if((view.tela==="ficha"||view.tela==="relatorio")&&!crianca())go({tela:"home"});
 }catch(e){NUVEM.ref=null;status("Salvo neste aparelho","#eeae69")}}

const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200)}
function itens(t){const r=[];T[t].campos.forEach((c,ci)=>c[1].forEach((it,ii)=>r.push({k:ci+"-"+ii,campo:c[0],txt:it[0],cod:it[1]})));return r}
function contar(c){const n={A:0,EP:0,AP:0,NO:0,vazio:0};itens(c.turma).forEach(i=>{const v=(c.marcas||{})[i.k];if(v)n[v]++;else n.vazio++});n.total=itens(c.turma).length;return n}
function barra(n){return `<div class="bar">${["A","EP","AP","NO"].map(v=>`<span style="width:${n[v]/n.total*100}%;background:var(--${v})"></span>`).join("")}</div>`}
function crianca(){if(view.ext)return view.ext;return DB.criancas.find(c=>c.id===view.id)}
function go(v){if(!("ext" in v)&&v.tela&&v.tela!=="relatorio")view.ext=null;Object.assign(view,v);render();window.scrollTo(0,0)}

const PKEY="em-pin-v1";let BLOQ=true,tentativas=0,esperaAte=0,ultimo=Date.now();
function pinCfg(){try{return JSON.parse(localStorage.getItem(PKEY)||"null")}catch(e){return null}}
function telaPin(app){
 const cfg=pinCfg();const criar=!cfg;
 $("#title").textContent="Registro de Observação";$("#back").style.display="none";
 app.innerHTML=`<div class="card stack" style="max-width:380px;margin:40px auto;text-align:center;align-items:center"><img src="${LOGO_MR}" alt="Colégio Moraes Rêgo" style="height:70px">
 <p class="eyebrow">${criar?"Primeiro acesso neste aparelho":"App bloqueado"}</p>
 <h2>${criar?"Crie um PIN de 4 dígitos":"Digite seu PIN"}</h2>
 <p class="muted">${criar?"O PIN protege as fichas das crianças neste aparelho. O app bloqueia sozinho depois de alguns minutos sem uso.":"Para proteger os dados das crianças, o app pede o PIN ao abrir e após alguns minutos sem uso."}</p>
 <input id="pin1" inputmode="numeric" type="password" maxlength="4" autocomplete="off" style="font-size:32px;letter-spacing:16px;text-align:center;width:200px;border:1px solid var(--linha);border-radius:10px;padding:10px" placeholder="••••">
 ${criar?`<p class="muted" style="margin-bottom:-6px">Repita o PIN</p><input id="pin2" inputmode="numeric" type="password" maxlength="4" autocomplete="off" style="font-size:32px;letter-spacing:16px;text-align:center;width:200px;border:1px solid var(--linha);border-radius:10px;padding:10px" placeholder="••••">`:""}
 <button class="btn" id="pinok" style="width:200px">${criar?"Criar PIN":"Entrar"}</button>
 ${criar?"":`<button class="addnote" id="pinesq">Esqueci o PIN</button>`}</div>`;
 const ok=async()=>{const p1=$("#pin1").value;
  if(!/^\d{4}$/.test(p1)){toast("O PIN tem 4 números");return}
  if(criar){if(p1!==$("#pin2").value){toast("Os PINs não conferem");return}
   const salt=b64(crypto.getRandomValues(new Uint8Array(16)));try{localStorage.setItem(PKEY,JSON.stringify({salt,h:await hashPin(p1,salt)}))}catch(e){}
   desbloquear();return}
  if(Date.now()<esperaAte){toast(`Aguarde ${Math.ceil((esperaAte-Date.now())/1000)} segundos`);return}
  if(await hashPin(p1,cfg.salt)===cfg.h){tentativas=0;desbloquear()}
  else{tentativas++;$("#pin1").value="";if(tentativas>=5){esperaAte=Date.now()+60000*Math.pow(2,Math.min(tentativas-5,4));toast("Muitas tentativas. Aguarde para tentar de novo.")}else toast("PIN incorreto")}};
 $("#pinok").onclick=ok;
 app.querySelectorAll("input").forEach(x=>x.onkeydown=e=>{if(e.key==="Enter")ok()});
 $("#pin1").focus();
 $("#pinesq")&&($("#pinesq").onclick=()=>{if(confirm("Para criar um novo PIN, as fichas guardadas SÓ neste aparelho serão apagadas. Fichas salvas na nuvem voltam depois. Continuar?")){
  try{localStorage.removeItem(PKEY);localStorage.removeItem(KEY);localStorage.removeItem("em-senha-envio");localStorage.removeItem(RKEY)}catch(e){}
  DB={criancas:[]};REC={};render()}});
}
function desbloquear(){BLOQ=false;ultimo=Date.now();$("#lockBtn")&&($("#lockBtn").style.display="");go({tela:"home"})}
function bloquear(){BLOQ=true;document.querySelectorAll(".modal").forEach(m=>m.remove());$("#lockBtn")&&($("#lockBtn").style.display="none");render()}
["click","keydown","touchstart","scroll"].forEach(ev=>document.addEventListener(ev,()=>{ultimo=Date.now()},{passive:true}));
setInterval(()=>{if(!BLOQ&&Date.now()-ultimo>10*60000)bloquear()},20000);
let ocultoEm=0;document.addEventListener("visibilitychange",()=>{if(document.hidden)ocultoEm=Date.now();else if(!BLOQ&&ocultoEm&&Date.now()-ocultoEm>2*60000)bloquear()});
function render(){
 if(BLOQ)return telaPin($("#app"));
 $("#back").style.display=view.tela==="home"?"none":"block";
 const app=$("#app");
 if(view.tela==="home")return home(app);
 if(view.tela==="guia")return guia(app);
 if(view.tela==="coord")return coord(app);
 const c=crianca();if(!c)return go({tela:"home"});
 if(view.tela==="ficha")return ficha(app,c);
 if(view.tela==="relatorio")return relatorio(app,c);
}

function home(app){

 const lista=DB.criancas.filter(c=>view.filtro==="todas"||c.turma===view.filtro).sort((a,b)=>a.nome.localeCompare(b.nome,"pt"));
 app.innerHTML=`<div class="stack">
 <div><p class="eyebrow">Relatório final ${new Date().getFullYear()}</p><h2>Fichas das crianças</h2><p class="muted">Marque cada item como A, EP, AP ou NO ao longo do ano. O app monta o rascunho dos três blocos do relatório.</p></div>
 <div class="filter">${["todas",...ORDEM].map(k=>`<button class="chip ${view.filtro===k?"on":""}" data-f="${k}">${k==="todas"?"Todas":T[k].nome} <span style="opacity:.7">${k==="todas"?DB.criancas.length:DB.criancas.filter(c=>c.turma===k).length}</span></button>`).join("")}</div>
 ${lista.length?`<div class="grid">${lista.map(c=>{const n=contar(c);return `<button class="card child" data-id="${c.id}"><div><div class="nome">${esc(c.nome)}</div><div class="muted">${T[c.turma].nome}${c.idade?" · "+esc(c.idade):""}</div></div>${barra(n)}<div class="pills"><span class="pill pA">A ${n.A}</span><span class="pill pEP">EP ${n.EP}</span><span class="pill pAP">AP ${n.AP}</span><span class="pill pNO">NO ${n.NO}</span><span class="muted" style="margin-left:auto">${n.total-n.vazio}/${n.total}</span></div></button>`}).join("")}</div>`
 :`<div class="card empty"><p style="font-family:Newsreader,serif;font-size:22px;color:var(--pet)">Nenhuma criança cadastrada${view.filtro!=="todas"?" nesta turma":""}</p><p>Use o botão “Nova criança” para começar.</p></div>`}

 </div><button class="btn fab noprint" id="nova">+ Nova criança</button>`;

function modalCrianca(c){
 const m=document.createElement("div");m.className="modal";
 m.innerHTML=`<div class="card"><h2 style="font-size:26px">${c?"Editar dados":"Nova criança"}</h2>
 <div class="field"><label>Nome da criança</label><input id="mn" value="${esc(c?.nome||"")}" placeholder="Ex.: Ana Luiza"></div>
 <div class="field"><label>Turma</label><select id="mt">${ORDEM.map(k=>`<option value="${k}" ${(c?.turma||(view.filtro!=="todas"?view.filtro:"IIM"))===k?"selected":""}>${T[k].nome} · ${T[k].sub}</option>`).join("")}</select></div>
 <div class="field"><label>No texto do relatório, referir-se à criança como</label><select id="mp"><option value="">Pelo nome (sem pronome)</option><option value="ela">ela</option><option value="ele">ele</option></select></div>
 <div class="field"><label>Idade em 31 de março (opcional)</label><input id="mi" value="${esc(c?.idade||"")}" placeholder="Ex.: 3 anos e 2 meses"></div>
 <div class="field" id="mmw" style="display:none"><label>Momento na sala multietária</label><select id="mm"><option value="1">1º ano na sala (Maternal 1)</option><option value="2">Conclui o ciclo (Maternal 2)</option></select></div>
 <div class="row" style="justify-content:space-between">${c?`<button class="btn danger" id="mdel">Excluir</button>`:"<span></span>"}<div class="row"><button class="btn sec" id="mc">Cancelar</button><button class="btn" id="ms">Salvar</button></div></div></div>`;
 document.body.appendChild(m);
 const syncM=()=>{$("#mmw").style.display=$("#mt").value==="IIM"?"flex":"none"};
 $("#mt").onchange=syncM;if(c?.momento)$("#mm").value=c.momento;if(c?.pron)$("#mp").value=c.pron;syncM();
 $("#mn").focus();
 const fechar=()=>m.remove();
 m.onclick=e=>{if(e.target===m)fechar()};
 $("#mc").onclick=fechar;
 $("#ms").onclick=()=>{const nome=$("#mn").value.trim();if(!nome){$("#mn").focus();return}
  if(c){if(c.turma!==$("#mt").value&&Object.keys(c.marcas||{}).length&&!confirm("Mudar a turma apaga as marcações já feitas. Continuar?"))return;
   if(c.turma!==$("#mt").value){c.marcas={};c.notas={}}c.nome=nome;c.pron=$("#mp").value;c.turma=$("#mt").value;c.idade=$("#mi").value.trim();c.momento=$("#mm").value}
  else{const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);DB.criancas.push({id,nome,pron:$("#mp").value,turma:$("#mt").value,idade:$("#mi").value.trim(),momento:$("#mm").value,marcas:{},notas:{},textos:{}});view.id=id;view.tela="ficha";view.aba=0}
  save();fechar();render()};
 if(c)$("#mdel").onclick=()=>{if(confirm(`Excluir a ficha de ${c.nome}? Esta ação não pode ser desfeita.`)){DB.criancas=DB.criancas.filter(x=>x.id!==c.id);save();fechar();go({tela:"home"})}};
}

function ficha(app,c){
 $("#title").textContent=c.nome;
 const t=T[c.turma],n=contar(c);
 const campos=t.campos;
 app.innerHTML=`<div class="stack">
 <div class="row" style="justify-content:space-between;align-items:flex-end"><div><p class="eyebrow">${t.nome}${c.turma==="IIM"?(c.momento==="2"?" · Maternal 2":" · Maternal 1"):""}</p><h2>${esc(c.nome)}</h2><p class="muted">${t.sub}${c.idade?" · "+esc(c.idade)+" em março":""}</p></div>
 <div class="row noprint"><button class="btn ghost" id="edit">Editar dados</button><button class="btn" id="rel">Gerar relatório →</button></div></div>
 <div class="card stack" style="gap:8px">${barra(n)}<div class="pills"><span class="pill pA">Alcançado ${n.A}</span><span class="pill pEP">Em processo ${n.EP}</span><span class="pill pAP">A aprimorar ${n.AP}</span><span class="pill pNO">Não observado ${n.NO}</span><span class="muted" style="margin-left:auto">${n.vazio} sem marcação</span></div></div>
 <div class="tabs noprint">${campos.map((cp,i)=>{const its=cp[1].map((_,ii)=>i+"-"+ii);const feitos=its.filter(k=>(c.marcas||{})[k]).length;return `<button data-a="${i}" class="${view.aba===i?"on":""}">${cp[0].split(",")[0]} <span class="muted">${feitos}/${its.length}</span></button>`}).join("")}</div>
 <div class="campo"><div class="campo-h"><h3>${campos[view.aba][0]}</h3><button class="btn ghost noprint" id="todosNO" style="padding:6px 10px;font-size:13px">Marcar vazios como NO</button></div>
 ${campos[view.aba][1].map((it,ii)=>{const k=view.aba+"-"+ii,v=(c.marcas||{})[k],nt=(c.notas||{})[k]||"";return `<div class="item"><div class="item-top"><div class="item-txt">${esc(it[0])}<div class="cod">${esc(it[1])}</div></div>
 <div class="seg" data-k="${k}">${["A","EP","AP","NO"].map(x=>`<button data-v="${x}" class="${v===x?"on":""}" title="${LBL[x]}">${x}</button>`).join("")}</div></div>
 ${nt||view.abrir===k?`<div class="note"><textarea data-n="${k}" placeholder="Evidência: cena, material, fala da criança entre aspas, data">${esc(nt)}</textarea></div>`:`<button class="addnote noprint" data-add="${k}">+ registrar evidência</button>`}</div>`}).join("")}
 </div>
 <div class="row noprint" style="justify-content:space-between">${view.aba>0?`<button class="btn sec" id="prev">← ${campos[view.aba-1][0].split(",")[0]}</button>`:"<span></span>"}${view.aba<campos.length-1?`<button class="btn sec" id="next">${campos[view.aba+1][0].split(",")[0]} →</button>`:`<button class="btn" id="rel2">Gerar relatório →</button>`}</div>
 </div>`;
 app.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>go({aba:+b.dataset.a}));
 app.querySelectorAll(".seg").forEach(s=>s.querySelectorAll("button").forEach(b=>b.onclick=()=>{c.marcas=c.marcas||{};const k=s.dataset.k;c.marcas[k]=c.marcas[k]===b.dataset.v?undefined:b.dataset.v;if(!c.marcas[k])delete c.marcas[k];save();const y=window.scrollY;render();window.scrollTo(0,y)}));
 app.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{view.abrir=b.dataset.add;const y=window.scrollY;render();window.scrollTo(0,y);const ta=document.querySelector(`[data-n="${b.dataset.add}"]`);ta&&ta.focus()});
 app.querySelectorAll("[data-n]").forEach(ta=>ta.oninput=()=>{c.notas=c.notas||{};c.notas[ta.dataset.n]=ta.value;save()});
 $("#todosNO").onclick=()=>{campos[view.aba][1].forEach((_,ii)=>{const k=view.aba+"-"+ii;if(!c.marcas[k])c.marcas[k]="NO"});save();render()};
 $("#edit").onclick=()=>modalCrianca(c);
 $("#rel").onclick=()=>go({tela:"relatorio"});
 $("#prev")&&($("#prev").onclick=()=>go({aba:view.aba-1}));
 $("#next")&&($("#next").onclick=()=>go({aba:view.aba+1}));
 $("#rel2")&&($("#rel2").onclick=()=>go({tela:"relatorio"}));
}

function contr(prep,np){const t={em:{a:"na",o:"no",as:"nas",os:"nos"},a:{a:"à",o:"ao",as:"às",os:"aos"},de:{a:"da",o:"do",as:"das",os:"dos"}}[prep];
 if(!/^(a|o|as|os) /.test(np))return prep+" "+np;
 return np.replace(/(^|, | e )(a|o|as|os) /g,(m,sep,art)=>sep+t[art]+" ")}
function npDe(c,it){return genero(c,NP[it.txt]||lower1(limpa(it.txt)))}
function listaNP(c,its,prep){const a=its.map(i=>{const n=npDe(c,i);return prep?contr(prep,n):n});return lista(a)}
function plural(its){const n=NP[its[0].txt]||"";return its.length>1||/^(as|os) /.test(n)||/(, | e )(a|o|as|os) /.test(n)}
function rascunho(c,v){
 const nome=primeiro(c.nome);
 const pron=c.pron==="ele"?"ele":c.pron==="ela"?"ela":nome;
 const suj=i=>i%2===0?nome:pron;
 const grupos=porCampo(c,v);if(!grupos.length)return "";
 const C=cp=>CAMPO[cp]||{ab:[cp,cp],A:"avanços importantes",EP:"de apoio",AP:"propostas intencionais"};
 const t=[];
 if(v==="A"){
  t.push(`Ao longo do ano, ${nome} percorreu um caminho significativo de desenvolvimento, e diversas aprendizagens se consolidaram.`);
  grupos.forEach((g,i)=>{const cc=C(g.campo);const ps=partes(g.its,4);const p0=ps[0];const pl=plural(p0);let f;
   if(i%3===0)f=`${cc.ab[0]}, destaca${pl?"m":""}-se ${listaNP(c,p0)}. ${pl?"Essas conquistas revelam":"Essa conquista revela"} ${cc.A}.`;
   else if(i%3===1)f=`${cc.ab[0]}, ${suj(i)} avançou de forma consistente ${listaNP(c,p0,"em")}, o que evidencia ${cc.A}.`;
   else f=`${cc.ab[0]}, consolid${pl?"aram":"ou"}-se ${listaNP(c,p0)}. Esse percurso mostra ${cc.A}.`;
   ps.slice(1).forEach(p=>{f+=` Merece${plural(p)?"m":""} destaque, ainda, ${listaNP(c,p)}.`});
   t.push(f+nota(c,g.its))});
  t.push(`Trata-se de um percurso construído com dedicação, que fortalece a autonomia e a confiança de ${nome} para os próximos desafios.`);
 }
 if(v==="EP"){
  t.push(`Algumas aprendizagens importantes estão em construção e seguem sendo acompanhadas com atenção.`);
  grupos.forEach((g,i)=>{const cc=C(g.campo);const ps=partes(g.its,4);const p0=ps[0];let f;
   if(i%2===0)f=`${cc.ab[1]}, ${suj(i)} vem avançando ${listaNP(c,p0,"em")}, ${plural(p0)?"aspectos que já aparecem":"aspecto que já aparece"} em algumas situações e que ainda se beneficia${plural(p0)?"m":""} ${cc.EP}.`;
   else f=`${cc.ab[1]}, observa-se um processo em andamento no que se refere ${listaNP(c,p0,"a")}. Nesse caminho, ${suj(i)} se beneficia ${cc.EP}.`;
   ps.slice(1).forEach(p=>{f+=` Encontra${plural(p)?"m":""}-se igualmente em construção ${listaNP(c,p)}.`});
   t.push(f+nota(c,g.its))});
  t.push(`Com a continuidade do trabalho, a expectativa é que essas aprendizagens se consolidem gradualmente, respeitando o ritmo de ${nome}.`);
 }
 if(v==="AP"){
  const prox=T[c.turma].proxima;
  t.push(`Para a próxima etapa (${prox}), alguns aspectos merecem investimento intencional, de modo a favorecer a continuidade do desenvolvimento de ${nome}.`);
  grupos.forEach((g,i)=>{const cc=C(g.campo);const ps=partes(g.its,4);const p0=ps[0];let f;
   if(i%2===0)f=`${cc.ab[0]}, recomenda-se priorizar ${listaNP(c,p0)}, por meio de ${cc.AP}.`;
   else f=`${cc.ab[1]}, será importante fortalecer ${listaNP(c,p0)}, oferecendo ${cc.AP}.`;
   ps.slice(1).forEach(p=>{f+=` Merece${plural(p)?"m":""} atenção, também, ${listaNP(c,p)}.`});
   t.push(f+nota(c,g.its))});
  t.push(`A parceria entre escola e família será fundamental nesse percurso. Em casa, oferecer tempo, escuta atenta e oportunidades reais de participação no cotidiano contribui de forma significativa para essas conquistas.`);
 }
 return t.join(" ");
}

 const copiar=s=>{(navigator.clipboard?navigator.clipboard.writeText(s):Promise.reject()).then(()=>toast("Copiado")).catch(()=>{const ta=document.createElement("textarea");ta.value=s;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast("Copiado")}catch(e){toast("Selecione e copie manualmente")}ta.remove()})};

}

function slug(t){return (t||"professora").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,60)||"professora"}
// ---------- criptografia ----------
const b64=buf=>{let s="";const a=new Uint8Array(buf);for(let i=0;i<a.length;i+=8192)s+=String.fromCharCode.apply(null,a.subarray(i,i+8192));return btoa(s)};
const unb64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
async function chave(senha,salt,iter){const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(senha),"PBKDF2",false,["deriveKey"]);
 return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function cifrar(obj,senha){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),iter=310000;
 const k=await chave(senha,salt,iter);const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},k,new TextEncoder().encode(JSON.stringify(obj)));
 return {tipo:"envio-coordenacao-protegido",versao:2,kdf:"PBKDF2-SHA256",iter,salt:b64(salt),iv:b64(iv),dados:b64(ct)}}
async function decifrar(env,senha){const k=await chave(senha,unb64(env.salt),env.iter||310000);
 const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(env.iv)},k,unb64(env.dados));return JSON.parse(new TextDecoder().decode(pt))}
async function hashPin(pin,salt){const d=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(salt+":"+pin));return b64(d)}

function enviarCoord(){
 let nome="",lemb="";try{nome=localStorage.getItem("em-professora")||"";lemb=localStorage.getItem("em-senha-envio")||""}catch(e){}
 const m=document.createElement("div");m.className="modal";
 m.innerHTML=`<div class="card"><h2 style="font-size:26px">Enviar para a coordenação</h2>
 <p class="muted">O app gera um arquivo <b>protegido por senha</b> com as ${DB.criancas.length} fichas deste aparelho. Sem a senha de envio, ninguém consegue abrir o arquivo, mesmo que ele seja encaminhado por engano.</p>
 <div class="field"><label>Seu nome</label><input id="pn" placeholder="Ex.: Professora Júlia" autocomplete="off"></div>
 <div class="field"><label>Senha de envio (combinada com a coordenação)</label><input id="ps" type="password" autocomplete="off"></div>
 <div class="field" id="ps2w"><label>Confirme a senha de envio</label><input id="ps2" type="password" autocomplete="off"></div>
 <label class="row muted" style="gap:8px"><input type="checkbox" id="pl"> Lembrar a senha neste aparelho</label>
 <div class="row" style="justify-content:flex-end"><button class="btn sec" id="pc">Cancelar</button><button class="btn" id="pg">Gerar arquivo protegido</button></div></div>`;
 document.body.appendChild(m);$("#pn").value=nome;
 if(lemb){$("#ps").value=lemb;$("#ps2").value=lemb;$("#ps2w").style.display="none";$("#pl").checked=true}
 (nome?$("#ps"):$("#pn")).focus();
 const fechar=()=>m.remove();m.onclick=e=>{if(e.target===m)fechar()};$("#pc").onclick=fechar;
 $("#pg").onclick=async()=>{const n=$("#pn").value.trim(),sh=$("#ps").value;
  if(!n){$("#pn").focus();return}
  if(sh.length<8){toast("A senha de envio precisa ter pelo menos 8 caracteres");$("#ps").focus();return}
  if(sh!==$("#ps2").value){toast("As senhas não conferem");$("#ps2").focus();return}
  try{localStorage.setItem("em-professora",n);if($("#pl").checked)localStorage.setItem("em-senha-envio",sh);else localStorage.removeItem("em-senha-envio")}catch(e){}
  $("#pg").textContent="Protegendo…";$("#pg").disabled=true;
  try{const d=new Date();const env=await cifrar({professora:n,enviado:d.toISOString(),criancas:DB.criancas},sh);
   const ok=await salvarArquivo(`fichas-${slug(n)}-${d.toISOString().slice(0,10)}.json`,JSON.stringify(env));
   fechar();if(ok)alertaEnvio();else toast("Não foi possível gerar o arquivo neste aparelho")}
  catch(e){fechar();toast("Este navegador não permite gerar o arquivo protegido")}};
}
function alertaEnvio(){const m=document.createElement("div");m.className="modal";
 m.innerHTML=`<div class="card"><h2 style="font-size:26px">Arquivo gerado</h2><p>O arquivo foi salvo na pasta de downloads do aparelho. Agora:</p>
 <p><b>1.</b> Abra o WhatsApp ou o e-mail.<br><b>2.</b> Anexe o arquivo que começa com <b>fichas-</b> (pasta Downloads ou Arquivos).<br><b>3.</b> Envie para a coordenação.</p>
 <p class="muted">Você pode enviar de novo sempre que atualizar as fichas: a coordenação recebe a versão mais recente.</p>
 <div class="row" style="justify-content:flex-end"><button class="btn" id="ok">Entendi</button></div></div>`;
 document.body.appendChild(m);$("#ok").onclick=()=>m.remove()}
const RKEY="em-recebidas-v1";
let REC={};try{REC=JSON.parse(localStorage.getItem(RKEY)||"{}")}catch(e){}
function salvarRec(){try{localStorage.setItem(RKEY,JSON.stringify(REC))}catch(e){}}
let SENHA_REC="";
function pedirSenha(msg){return new Promise(res=>{const m=document.createElement("div");m.className="modal";
 m.innerHTML=`<div class="card"><h2 style="font-size:26px">Senha de envio</h2><p class="muted"></p><div class="field"><label>Senha</label><input id="sr" type="password" autocomplete="off"></div><div class="row" style="justify-content:flex-end"><button class="btn sec" id="src">Cancelar</button><button class="btn" id="sro">Abrir</button></div></div>`;
 m.querySelector("p").textContent=msg;document.body.appendChild(m);$("#sr").focus();
 const fim=v=>{m.remove();res(v)};$("#src").onclick=()=>fim(null);$("#sro").onclick=()=>fim($("#sr").value);$("#sr").onkeydown=e=>{if(e.key==="Enter")fim($("#sr").value)}})}
async function receberArquivos(files){
 let ok=0,erro=0,senhaErr=0;
 for(const f of files){let d;try{d=JSON.parse(await f.text())}catch(e){erro++;continue}
  try{
   if(d.tipo==="envio-coordenacao-protegido"){
    let aberto=null;
    if(SENHA_REC){try{aberto=await decifrar(d,SENHA_REC)}catch(e){}}
    while(!aberto){const sh=await pedirSenha(`Digite a senha de envio para abrir “${f.name}”.`);if(sh===null)break;
     try{aberto=await decifrar(d,sh);SENHA_REC=sh}catch(e){toast("Senha incorreta")}}
    if(!aberto){senhaErr++;continue}
    d={tipo:"envio-coordenacao",...aberto};
   }
   if(d.tipo!=="envio-coordenacao"||!Array.isArray(d.criancas))throw 0;
   const id=slug(d.professora);const atual=REC[id];
   if(atual&&atual.enviado>d.enviado){ok++;continue}
   REC[id]={professora:d.professora,enviado:d.enviado,criancas:d.criancas.filter(c=>c&&T[c.turma])};
   if(NUVEM.db&&NUVEM.coord){try{await NUVEM.db.doc("recebidas/"+id).set(JSON.parse(JSON.stringify(REC[id])))}catch(e){}}
   ok++}catch(e){erro++}}
 salvarRec();
 toast(ok?`${ok} arquivo(s) recebido(s)${erro+senhaErr?` · ${erro+senhaErr} não aberto(s)`:""}`:(senhaErr?"Arquivo não aberto: senha não informada":"Arquivo inválido: use o arquivo gerado em “Enviar para a coordenação”"));
 if(view.tela==="coord")coord($("#app"));
}
async function coord(app){
 $("#title").textContent="Coordenação";
 app.innerHTML=`<div class="stack"><div><p class="eyebrow">Visão da coordenação</p><h2>Fichas de todas as professoras</h2><p class="muted">Somente leitura. Aqui aparecem as fichas salvas na nuvem e os arquivos enviados pelas professoras. Os arquivos chegam protegidos pela senha de envio que você combinou com a equipe (mínimo de 8 caracteres).</p></div><div class="row noprint"><button class="btn" id="rcb">Receber arquivo de professora</button><input type="file" id="rcf" accept=".json,application/json" multiple hidden></div><div class="card empty" id="cl">Carregando…</div></div>`;
 $("#rcb").onclick=()=>$("#rcf").click();$("#rcf").onchange=e=>{receberArquivos([...e.target.files]);e.target.value=""};
 const fontes=[];let aviso="";
 if(NUVEM.db&&NUVEM.coord){
  try{const snap=await comTempo(NUVEM.db.collection("professoras").get(),10000);const docs=snap.docs.filter(d=>d.exists);
   const ps=docs.length?await NUVEM.user.profiles(docs.map(d=>d.id)):{};
   docs.forEach(d=>fontes.push({titulo:(ps[d.id]&&ps[d.id].name||"Professora")+(ps[d.id]&&ps[d.id].isMe?" (você)":""),sub:"salvo na nuvem",criancas:(d.data()||{}).criancas||[]}))}catch(e){aviso="Não foi possível carregar as fichas da nuvem agora."}
  try{const snap=await comTempo(NUVEM.db.collection("recebidas").get(),10000);snap.docs.filter(d=>d.exists).forEach(d=>{const r=d.data();const loc=REC[d.id];if(!loc||loc.enviado<r.enviado)REC[d.id]=JSON.parse(JSON.stringify(r))});salvarRec()}catch(e){}
 }
 Object.values(REC).forEach(r=>fontes.push({titulo:r.professora,sub:"arquivo recebido em "+new Date(r.enviado).toLocaleDateString("pt-BR")+" às "+new Date(r.enviado).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}),criancas:r.criancas||[],rid:slug(r.professora)}));
 if(view.tela!=="coord")return;
 const filtro=view.cf||"todas";
 const box=document.createElement("div");box.className="stack";
 const chips=document.createElement("div");chips.className="filter";
 ["todas",...ORDEM].forEach(k=>{const b=document.createElement("button");b.className="chip"+(filtro===k?" on":"");b.textContent=k==="todas"?"Todas as turmas":T[k].nome;b.onclick=()=>{view.cf=k;coord(app)};chips.appendChild(b)});
 box.appendChild(chips);
 let total=0;
 if(aviso){const e=document.createElement("div");e.className="card muted";e.textContent=aviso;box.appendChild(e)}
 fontes.forEach(fo=>{const kids=(fo.criancas||[]).filter(c=>c&&T[c.turma]&&(filtro==="todas"||c.turma===filtro));if(!kids.length)return;total+=kids.length;
  const sec=document.createElement("div");sec.className="stack";sec.style.gap="10px";
  const hh=document.createElement("div");hh.className="row";hh.style.justifyContent="space-between";
  const h=document.createElement("div");const h3=document.createElement("h3");h3.style.fontSize="18px";h3.textContent=fo.titulo+` · ${kids.length} ${kids.length===1?"criança":"crianças"}`;const sm=document.createElement("p");sm.className="muted";sm.textContent=fo.sub;h.appendChild(h3);h.appendChild(sm);hh.appendChild(h);
  if(fo.rid){const rb=document.createElement("button");rb.className="btn danger noprint";rb.style.padding="6px 10px";rb.style.fontSize="13px";rb.textContent="Remover";rb.onclick=async()=>{if(!confirm(`Remover as fichas recebidas de ${fo.titulo}?`))return;delete REC[fo.rid];salvarRec();if(NUVEM.db&&NUVEM.coord){try{await NUVEM.db.doc("recebidas/"+fo.rid).delete()}catch(e){}}coord($("#app"))};hh.appendChild(rb)}
  sec.appendChild(hh);
  const g=document.createElement("div");g.className="grid";
  kids.sort((a,b)=>a.nome.localeCompare(b.nome,"pt")).forEach(c=>{const n=contar(c);const b=document.createElement("button");b.className="card child";
   b.innerHTML=`<div><div class="nome"></div><div class="muted">${T[c.turma].nome}</div></div>${barra(n)}<div class="pills"><span class="pill pA">A ${n.A}</span><span class="pill pEP">EP ${n.EP}</span><span class="pill pAP">AP ${n.AP}</span><span class="pill pNO">NO ${n.NO}</span><span class="muted" style="margin-left:auto">${n.total-n.vazio}/${n.total}</span></div>`;
   b.querySelector(".nome").textContent=c.nome;
   b.onclick=()=>go({tela:"relatorio",ext:JSON.parse(JSON.stringify(c))});g.appendChild(b)});
  sec.appendChild(g);box.appendChild(sec)});
 if(!total){const e=document.createElement("div");e.className="card empty";e.textContent=fontes.length?"Nenhuma ficha nesta turma.":"Nenhuma ficha recebida ainda. Quando uma professora enviar o arquivo, toque em “Receber arquivo de professora”.";box.appendChild(e)}
 const cl=$("#cl");cl.replaceWith(box);
}
async function exportar(){
 const filename=`registro-observacao-${new Date().toISOString().slice(0,10)}.json`,data=JSON.stringify(DB,null,1);
 try{const dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null;
  if(dl){await dl.save({filename,data});toast("Backup exportado");return}}catch(e){toast("Exportação cancelada");return}
 try{const blob=new Blob([data],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();toast("Backup exportado")}catch(e){toast("Não foi possível exportar neste aparelho")}
}
function importar(e){
 const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.criancas))throw 0;
  const novos=d.criancas.filter(x=>!DB.criancas.some(y=>y.id===x.id));const rep=d.criancas.length-novos.length;
  if(rep&&confirm(`${rep} ficha(s) já existem neste aparelho. Substituir pelas do backup?`)){d.criancas.forEach(x=>{const i=DB.criancas.findIndex(y=>y.id===x.id);if(i>=0)DB.criancas[i]=x})}
  DB.criancas.push(...novos);save();render();toast(`${d.criancas.length} ficha(s) importadas`)}catch(err){toast("Arquivo de backup inválido")}};
 r.readAsText(f);e.target.value="";
}
$("#back").onclick=()=>{if(view.tela==="relatorio"&&view.ext)go({tela:"coord",ext:null});else if(view.tela==="relatorio")go({tela:"ficha"});else go({tela:"home"})};
$("#guiaBtn").onclick=()=>{if(!BLOQ)go({tela:"guia"})};
$("#lockBtn").onclick=bloquear;
render();
iniciarNuvem();
</script>
