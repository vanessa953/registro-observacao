<style>
:root{--base:#faf7f2;--acolh:#f0e7da;--pet:#0f4c45;--prof:#082f2c;--verde:#55c1a2;--vesc:#176b58;--vten:#d4efe6;--tinta:#1e2a28;--suave:#4e5c59;--dour:#7d5f2c;--linha:#dcd2c4;--forte:#92806a;--A:#176b58;--EP:#b07a1f;--AP:#b4475f;--NO:#7a7f7d}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Source Sans 3',Arial,sans-serif;background:var(--base);color:var(--tinta);font-size:16px;line-height:1.45;min-height:100vh}

.back{font-size:22px;padding:4px 10px;border-radius:8px}

main{max-width:980px;margin:0 auto;padding:20px 16px 100px}
.card{background:#fff;border:1px solid var(--linha);border-radius:12px;padding:18px}

.btn{background:var(--pet);color:var(--base);padding:10px 16px;border-radius:10px;font-weight:600}
.btn:hover{background:var(--prof)}
.btn.sec{background:var(--acolh);color:var(--pet)}
.btn.sec:hover{background:#e6d9c6}
.btn.ghost{background:transparent;color:var(--vesc);border:1px solid var(--linha)}
.btn.danger{background:transparent;color:var(--AP);border:1px solid #e8c4cd}
.field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:180px}
.field label{font-size:13px;font-weight:600;color:var(--suave)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}

.pill{font-size:12px;font-weight:700;padding:2px 8px;border-radius:20px;color:#fff}
.pA{background:var(--A)}.pEP{background:var(--EP)}.pAP{background:var(--AP)}.pNO{background:var(--NO)}
.filter{display:flex;gap:6px;flex-wrap:wrap}

.tabs button.on{color:var(--pet);border-color:var(--verde)}
.campo{display:flex;flex-direction:column;gap:0}
.campo-h{display:flex;justify-content:space-between;align-items:center;padding:14px 0 8px;gap:10px}

.item-txt{flex:1;min-width:200px}
.item-txt .cod{font-size:12px;color:var(--dour);font-weight:600;margin-top:2px}
.seg{display:flex;border:1px solid var(--linha);border-radius:8px;overflow:hidden;flex-shrink:0}

.seg button.on[data-v=EP]{background:var(--EP);color:#fff}
.seg button.on[data-v=AP]{background:var(--AP);color:#fff}
.seg button.on[data-v=NO]{background:var(--NO);color:#fff}
.note{display:flex;gap:8px;align-items:flex-start}
.note textarea{flex:1;min-height:40px;resize:vertical;font-size:14px}
.addnote{font-size:13px;color:var(--vesc);font-weight:600;align-self:flex-start}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.legend div{border-left:4px solid;padding:8px 12px;background:#fff;border-radius:0 8px 8px 0;font-size:14px}
.bloco{border-left:5px solid;padding:16px 18px;background:#fff;border-radius:0 12px 12px 0;display:flex;flex-direction:column;gap:10px}
.bloco textarea{min-height:170px;width:100%;line-height:1.55;font-size:15px}
.fab{position:fixed;right:20px;bottom:20px;box-shadow:0 6px 20px rgba(8,47,44,.25);border-radius:30px;padding:14px 22px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--prof);color:#fff;padding:10px 18px;border-radius:24px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
.modal{position:fixed;inset:0;background:rgba(8,47,44,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:40}
.modal .card{max-width:480px;width:100%;display:flex;flex-direction:column;gap:14px}
table.g{border-collapse:collapse;width:100%;font-size:14px}
table.g th{background:var(--pet);color:#fff;text-align:left;padding:8px 10px}
table.g td{padding:8px 10px;border-bottom:1px solid var(--linha);vertical-align:top}
table.g tr:nth-child(even) td{background:var(--acolh)}
.empty{text-align:center;padding:40px 20px;color:var(--suave)}
footer{font-size:12px;color:var(--suave);text-align:center;padding:24px 16px}
@media print{header,.noprint,.fab,.tabs{display:none!important}body{background:#fff}main{padding:0}.bloco{border:none;padding:0 0 14px}.bloco textarea{border:none;min-height:0;height:auto;overflow:visible}}
</style>
</head>

const ABERT={"O eu, o outro e o nós":["Na convivência com os colegas","Nas relações com o grupo"],"Corpo, gestos e movimentos":["No cuidado de si e nos movimentos","Nas atividades com o corpo e de vida prática"],"Traços, sons, cores e formas":["Nas artes e na música","Nas experiências artísticas"],"Escuta, fala, pensamento e imaginação":["Na linguagem","Na comunicação e na linguagem"],"Espaços, tempos, quantidades, relações e transformações":["Nas descobertas sobre quantidades, formas e natureza","No raciocínio e nas descobertas sobre o mundo"],"Olhar montessoriano":["Em relação à concentração e à autonomia","Na forma de se dedicar às atividades"],"Língua Portuguesa":["Em Língua Portuguesa","Na leitura e na escrita"],"Matemática":["Em Matemática","No raciocínio matemático"],"Ciências, História e Geografia":["Nas descobertas sobre o mundo","Em Ciências, História e Geografia"],"Arte e Educação Física":["Em Arte e Educação Física","Nas artes e nos jogos"],"Socioemocional e olhar montessoriano":["Na organização do trabalho e na vida em grupo","Na convivência e na autonomia"]};
function lista(a){return a.length<2?(a[0]||""):a.slice(0,-1).join(", ")+" e "+a[a.length-1]}
function genero(c,t){if(c.pron==="ele")t=t.replace(/\bcalma\b/g,"calmo").replace(/\bsozinha\b/g,"sozinho");return t}
function frasePres(c,txt){return genero(c,lower1(limpa(txt)))}
function fraseInf(c,txt){return genero(c,INF[txt]||lower1(limpa(txt)))}
function cap(t){return t.charAt(0).toUpperCase()+t.slice(1)}
function nota(c,its){const n=its.map(i=>((c.notas||{})[i.k]||"").trim()).filter(Boolean).map(x=>cap(x).replace(/([^.!?…”"])$/,"$1."));return n.length?" "+n.join(" "):""}
function porCampo(c,v){const g=[];itens(c.turma).forEach(i=>{if((c.marcas||{})[i.k]!==v)return;let x=g.find(y=>y.campo===i.campo);if(!x){x={campo:i.campo,its:[]};g.push(x)}x.its.push(i)});return g}
function listaPres(c,its){const a=its.map(x=>frasePres(c,x.txt));if(a.length<2)return a[0]||"";
 if(a.slice(0,-1).some(x=>/ e /.test(x)))return a.slice(0,-1).join(", ")+", além de "+fraseInf(c,its[its.length-1].txt);
 return lista(a)}
function listaInf(c,its){const a=its.map(x=>fraseInf(c,x.txt));if(a.length<2)return a[0]||"";
 if(a.slice(0,-1).some(x=>/ e /.test(x)))return a.slice(0,-1).join(", ")+", bem como "+a[a.length-1];
 return lista(a)}
function partes(a,n){const r=[];for(let i=0;i<a.length;i+=n)r.push(a.slice(i,i+n));return r}
function rascunho(c,v){
 const nome=primeiro(c.nome),pron=c.pron==="ele"?"ele":c.pron==="ela"?"ela":"a criança";
 const suj=i=>i%2===0?nome:pron;
 const grupos=porCampo(c,v);if(!grupos.length)return "";
 const ab=(cp,k)=>(ABERT[cp]||[cp])[k%((ABERT[cp]||[cp]).length)];
 const t=[];
 if(v==="A"){
  t.push(`Ao longo do ano, ${nome} viveu conquistas importantes em seu percurso.`);
  const lig=[x=>`${cap(x)} também`,x=>`Além disso, ${x}`,x=>`Da mesma forma, ${x}`];
  grupos.forEach((g,i)=>{const ps=partes(g.its,3);
   let f=`${ab(g.campo,0)}, ${suj(i)} ${listaPres(c,ps[0])}.`;
   ps.slice(1).forEach((p,j)=>{f+=` ${lig[(i+j)%lig.length](j%2===0?(i%2===0?pron:nome):suj(i))} ${listaPres(c,p)}.`});
   t.push(f+nota(c,g.its))});
  t.push(`São conquistas que revelam ${nome==="a criança"?"uma criança":"uma criança"} cada vez mais segura e autônoma em seu desenvolvimento.`);
 }
 if(v==="EP"){
  t.push(`Algumas aprendizagens importantes estão em pleno desenvolvimento.`);
  const caudas=[", ainda com o apoio do adulto em alguns momentos",", em situações que vêm se tornando cada vez mais frequentes",", e segue avançando com a mediação da professora"];
  grupos.forEach((g,i)=>{const ps=partes(g.its,3);
   let f=`${ab(g.campo,1)}, ${suj(i)} já ${listaPres(c,ps[0])}${caudas[i%3]}.`;
   ps.slice(1).forEach(p=>{f+=` Começa também a ${listaInf(c,p)}.`});
   t.push(f+nota(c,g.its))});
  t.push(`Seguiremos oferecendo oportunidades para que essas aprendizagens se consolidem.`);
 }
 if(v==="AP"){
  const prox=T[c.turma].proxima;
  t.push(`Para a próxima etapa (${prox}), alguns aspectos merecem atenção especial no percurso de ${nome}.`);
  const mod=[(o,x)=>`${o}, será importante incentivar ${nome} a ${x}.`,(o,x)=>`${o}, convém oferecer situações frequentes e intencionais para que ${pron==="a criança"?"a criança":nome} possa ${x}.`,(o,x)=>`${o}, ${pron} se beneficiará de propostas que ${c.pron==="ele"?"o":"a"} ajudem a ${x}.`];
  grupos.forEach((g,i)=>{const ps=partes(g.its,3);let f=mod[i%3](ab(g.campo,i%2),listaInf(c,ps[0]));
   const obj=c.pron==="ele"?"apoiá-lo":c.pron==="ela"?"apoiá-la":"apoiar "+nome;ps.slice(1).forEach(p=>{f+=` Vale ainda ${obj} a ${listaInf(c,p)}.`});
   t.push(f+nota(c,g.its))});
  t.push(`Em casa, a família pode apoiar esse caminho oferecendo tempo, oportunidades reais de participação e escuta atenta.`);
 }
 return t.join(" ");
}

function relatorio(app,c){

 const ro=!!view.ext;const t=T[c.turma],n=contar(c);c.textos=c.textos||{};
 const blocos=[["A","Conquistas consolidadas","o que foi alcançado com sucesso","var(--A)"],["EP","Aprendizagens em processo","o que ainda está se construindo","var(--EP)"],["AP",`Aspectos a aprimorar na próxima etapa (${t.proxima})`,"o que a próxima professora e a família devem apoiar","var(--AP)"]];
 app.innerHTML=`<div class="stack">
 <div><p class="eyebrow">Percurso individual da criança</p><h2>${esc(c.nome)}</h2><p class="muted">${t.nome} · ${t.sub}</p></div>
 ${n.vazio?`<div class="card noprint" style="background:#f9eeda;border-color:#e8d5a8"><b>${n.vazio} itens ainda sem marcação.</b> O rascunho considera apenas os itens marcados.</div>`:""}

 ${blocos.map(([v,tit,sub,cor])=>{const its=itens(c.turma).filter(i=>(c.marcas||{})[i.k]===v);const txt=c.textos[v]??rascunho(c,v);return `<div class="bloco" style="border-color:${cor}">
 <div class="row" style="justify-content:space-between"><div><h3>${tit}</h3><p class="muted">${sub} · ${its.length} ${its.length===1?"item":"itens"}</p></div>
 <div class="row noprint"><button class="btn ghost" data-re="${v}" style="padding:6px 10px;font-size:13px">Refazer rascunho</button><button class="btn sec" data-cp="${v}" style="padding:6px 10px;font-size:13px">Copiar</button></div></div>
 ${its.length?`<details class="noprint"><summary class="muted" style="cursor:pointer">Ver itens marcados</summary><table class="g" style="margin-top:8px"><tr><th>Item</th><th>BNCC</th><th>Evidência</th></tr>${its.map(i=>`<tr><td>${esc(i.txt)}</td><td>${esc(i.cod)}</td><td>${esc((c.notas||{})[i.k]||"—")}</td></tr>`).join("")}</table></details>`:""}
 <textarea data-t="${v}" ${ro?"readonly":""} placeholder="Nenhum item marcado com ${v}. Escreva aqui, se necessário.">${esc(txt)}</textarea></div>`}).join("")}
 <div class="row noprint"><button class="btn sec" id="voltar">${ro?"← Voltar à coordenação":"← Voltar à ficha"}</button><button class="btn sec" id="cpall">Copiar os três blocos</button><button class="btn" id="print">Imprimir</button></div>
 </div>`;

function salvarArquivo(filename,data){return (async()=>{
 try{const dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null;
  if(dl){await dl.save({filename,data});return true}}catch(e){return false}
 try{const blob=new Blob([data],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();return true}catch(e){return false}})()}
function slug(t){return (t||"professora").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,60)||"professora"}
// ---------- criptografia ----------
const b64=buf=>{let s="";const a=new Uint8Array(buf);for(let i=0;i<a.length;i+=8192)s+=String.fromCharCode.apply(null,a.subarray(i,i+8192));return btoa(s)};
const unb64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
async function chave(senha,salt,iter){const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(senha),"PBKDF2",false,["deriveKey"]);
 return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function cifrar(obj,senha){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),iter=310000;
 const k=await chave(senha,salt,iter);const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},k,new TextEncoder().encode(JSON.stringify(obj)));
 return {tipo:"envio-coordenacao-protegido",versao:2,kdf:"PBKDF2-SHA256",iter,salt:b64(salt),iv:b64(iv),dados:b64(ct)}}
async function decifrar(env,senha){const k=await chave(senha,unb64(env.salt),env.iter||310000);
 const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(env.iv)},k,unb64(env.dados));return JSON.parse(new TextDecoder().decode(pt))}
async function hashPin(pin,salt){const d=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(salt+":"+pin));return b64(d)}

function enviarCoord(){
 let nome="",lemb="";try{nome=localStorage.getItem("em-professora")||"";lemb=localStorage.getItem("em-senha-envio")||""}catch(e){}
 const m=document.createElement("div");m.className="modal";
 m.innerHTML=`<div class="card"><h2 style="font-size:26px">Enviar para a coordenação</h2>
 <p class="muted">O app gera um arquivo <b>protegido por senha</b> com as ${DB.criancas.length} fichas deste aparelho. Sem a senha de envio, ninguém consegue abrir o arquivo, mesmo que ele seja encaminhado por engano.</p>
 <div class="field"><label>Seu nome</label><input id="pn" placeholder="Ex.: Professora Júlia" autocomplete="off"></div>
 <div class="field"><label>Senha de envio (combinada com a coordenação)</label><input id="ps" type="password" autocomplete="off"></div>

let SENHA_REC="";
function pedirSenha(msg){return new Promise(res=>{const m=document.createElement("div");m.className="modal";
 m.innerHTML=`<div class="card"><h2 style="font-size:26px">Senha de envio</h2><p class="muted"></p><div class="field"><label>Senha</label><input id="sr" type="password" autocomplete="off"></div><div class="row" style="justify-content:flex-end"><button class="btn sec" id="src">Cancelar</button><button class="btn" id="sro">Abrir</button></div></div>`;

async function receberArquivos(files){
 let ok=0,erro=0,senhaErr=0;
 for(const f of files){let d;try{d=JSON.parse(await f.text())}catch(e){erro++;continue}
  try{
   if(d.tipo==="envio-coordenacao-protegido"){
    let aberto=null;
    if(SENHA_REC){try{aberto=await decifrar(d,SENHA_REC)}catch(e){}}
    while(!aberto){const sh=await pedirSenha(`Digite a senha de envio para abrir “${f.name}”.`);if(sh===null)break;
     try{aberto=await decifrar(d,sh);SENHA_REC=sh}catch(e){toast("Senha incorreta")}}
    if(!aberto){senhaErr++;continue}
    d={tipo:"envio-coordenacao",...aberto};
   }
   if(d.tipo!=="envio-coordenacao"||!Array.isArray(d.criancas))throw 0;
   const id=slug(d.professora);const atual=REC[id];
   if(atual&&atual.enviado>d.enviado){ok++;continue}
   REC[id]={professora:d.professora,enviado:d.enviado,criancas:d.criancas.filter(c=>c&&T[c.turma])};
   if(NUVEM.db&&NUVEM.coord){try{await NUVEM.db.doc("recebidas/"+id).set(JSON.parse(JSON.stringify(REC[id])))}catch(e){}}
   ok++}catch(e){erro++}}
 salvarRec();
 toast(ok?`${ok} arquivo(s) recebido(s)${erro+senhaErr?` · ${erro+senhaErr} não aberto(s)`:""}`:(senhaErr?"Arquivo não aberto: senha não informada":"Arquivo inválido: use o arquivo gerado em “Enviar para a coordenação”"));
 if(view.tela==="coord")coord($("#app"));
}
async function coord(app){

 $("#rcb").onclick=()=>$("#rcf").click();$("#rcf").onchange=e=>{receberArquivos([...e.target.files]);e.target.value=""};
 const fontes=[];let aviso="";
 if(NUVEM.db&&NUVEM.coord){
  try{const snap=await comTempo(NUVEM.db.collection("professoras").get(),10000);const docs=snap.docs.filter(d=>d.exists);
   const ps=docs.length?await NUVEM.user.profiles(docs.map(d=>d.id)):{};
   docs.forEach(d=>fontes.push({titulo:(ps[d.id]&&ps[d.id].name||"Professora")+(ps[d.id]&&ps[d.id].isMe?" (você)":""),sub:"salvo na nuvem",criancas:(d.data()||{}).criancas||[]}))}catch(e){aviso="Não foi possível carregar as fichas da nuvem agora."}
  try{const snap=await comTempo(NUVEM.db.collection("recebidas").get(),10000);snap.docs.filter(d=>d.exists).forEach(d=>{const r=d.data();const loc=REC[d.id];if(!loc||loc.enviado<r.enviado)REC[d.id]=JSON.parse(JSON.stringify(r))});salvarRec()}catch(e){}
 }
 Object.values(REC).forEach(r=>fontes.push({titulo:r.professora,sub:"arquivo recebido em "+new Date(r.enviado).toLocaleDateString("pt-BR")+" às "+new Date(r.enviado).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}),criancas:r.criancas||[],rid:slug(r.professora)}));
 if(view.tela!=="coord")return;
 const filtro=view.cf||"todas";
 const box=document.createElement("div");box.className="stack";
 const chips=document.createElement("div");chips.className="filter";
 ["todas",...ORDEM].forEach(k=>{const b=document.createElement("button");b.className="chip"+(filtro===k?" on":"");b.textContent=k==="todas"?"Todas as turmas":T[k].nome;b.onclick=()=>{view.cf=k;coord(app)};chips.appendChild(b)});
 box.appendChild(chips);
 let total=0;
 if(aviso){const e=document.createElement("div");e.className="card muted";e.textContent=aviso;box.appendChild(e)}
 fontes.forEach(fo=>{const kids=(fo.criancas||[]).filter(c=>c&&T[c.turma]&&(filtro==="todas"||c.turma===filtro));if(!kids.length)return;total+=kids.length;
  const sec=document.createElement("div");sec.className="stack";sec.style.gap="10px";
  const hh=document.createElement("div");hh.className="row";hh.style.justifyContent="space-between";
  const h=document.createElement("div");const h3=document.createElement("h3");h3.style.fontSize="18px";h3.textContent=fo.titulo+` · ${kids.length} ${kids.length===1?"criança":"crianças"}`;const sm=document.createElement("p");sm.className="muted";sm.textContent=fo.sub;h.appendChild(h3);h.appendChild(sm);hh.appendChild(h);
  if(fo.rid){const rb=document.createElement("button");rb.className="btn danger noprint";rb.style.padding="6px 10px";rb.style.fontSize="13px";rb.textContent="Remover";rb.onclick=async()=>{if(!confirm(`Remover as fichas recebidas de ${fo.titulo}?`))return;delete REC[fo.rid];salvarRec();if(NUVEM.db&&NUVEM.coord){try{await NUVEM.db.doc("recebidas/"+fo.rid).delete()}catch(e){}}coord($("#app"))};hh.appendChild(rb)}
  sec.appendChild(hh);
  const g=document.createElement("div");g.className="grid";
  kids.sort((a,b)=>a.nome.localeCompare(b.nome,"pt")).forEach(c=>{const n=contar(c);const b=document.createElement("button");b.className="card child";
   b.innerHTML=`<div><div class="nome"></div><div class="muted">${T[c.turma].nome}</div></div>${barra(n)}<div class="pills"><span class="pill pA">A ${n.A}</span><span class="pill pEP">EP ${n.EP}</span><span class="pill pAP">AP ${n.AP}</span><span class="pill pNO">NO ${n.NO}</span><span class="muted" style="margin-left:auto">${n.total-n.vazio}/${n.total}</span></div>`;
   b.querySelector(".nome").textContent=c.nome;
   b.onclick=()=>go({tela:"relatorio",ext:JSON.parse(JSON.stringify(c))});g.appendChild(b)});
  sec.appendChild(g);box.appendChild(sec)});
 if(!total){const e=document.createElement("div");e.className="card empty";e.textContent=fontes.length?"Nenhuma ficha nesta turma.":"Nenhuma ficha recebida ainda. Quando uma professora enviar o arquivo, toque em “Receber arquivo de professora”.";box.appendChild(e)}

function importar(e){

 r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.criancas))throw 0;
  const novos=d.criancas.filter(x=>!DB.criancas.some(y=>y.id===x.id));const rep=d.criancas.length-novos.length;
  if(rep&&confirm(`${rep} ficha(s) já existem neste aparelho. Substituir pelas do backup?`)){d.criancas.forEach(x=>{const i=DB.criancas.findIndex(y=>y.id===x.id);if(i>=0)DB.criancas[i]=x})}
  DB.criancas.push(...novos);save();render();toast(`${d.criancas.length} ficha(s) importadas`)}catch(err){toast("Arquivo de backup inválido")}};
 r.readAsText(f);e.target.value="";
}
